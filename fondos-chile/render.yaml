# Blueprint de Render. En Render: New > Blueprint, elija este repositorio.
# El disco persistente requiere un plan pago; sin él, los proyectos se pierden al reiniciar.
services:
  - type: web
    name: brujula-fondos-chile
    runtime: docker
    rootDir: fondos-chile
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOW_ORIGIN
        value: https://felipeduarte91.github.io
      - key: STORE_FILE
        value: /data/proyectos.json
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
